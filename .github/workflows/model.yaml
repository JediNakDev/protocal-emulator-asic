name: model
on: [push, workflow_dispatch]
jobs:
  model:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Build and run the C protocol model (all pass criteria)
        run: make model

      - name: Run again with warnings as errors and sanitizers
        run: |
          make -C model clean
          make -C model test CFLAGS="-O1 -g -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined"
