name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install RTL tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run lint and tests
        run: |
          make -C test clean
          make check
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure test/results.xml

      # Explore new seeds on every run; a failure names the seed to rerun.
      - name: Random model comparison soak
        run: |
          make -C test COCOTB_TEST_MODULES=test_random COCOTB_RESULTS_FILE=soak.xml \
            PE_RANDOM_SEEDS=200 PE_RANDOM_SEED=$((GITHUB_RUN_NUMBER * 1000))
          ! grep failure test/soak.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: |
            test/results.xml
            test/soak.xml
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/soak.xml
            test/output/*
