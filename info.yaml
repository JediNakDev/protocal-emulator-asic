# Tiny Tapeout project information
project:
  title:        "Programmable Protocol Emulator"
  author:       "JediNakDev" # Replace with your preferred name before submission
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Development scaffold for a programmable protocol emulator"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000 # Initial target, matching CLOCK_PERIOD=20ns in src/config.json

  # Competition allocation: 24 tiles on IHP's 130nm CMOS5L process.
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_jedinakdev_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "A[0]"
  ui[1]: "A[1]"
  ui[2]: "A[2]"
  ui[3]: "A[3]"
  ui[4]: "A[4]"
  ui[5]: "A[5]"
  ui[6]: "A[6]"
  ui[7]: "A[7]"

  # Outputs
  uo[0]: "SUM[0]"
  uo[1]: "SUM[1]"
  uo[2]: "SUM[2]"
  uo[3]: "SUM[3]"
  uo[4]: "SUM[4]"
  uo[5]: "SUM[5]"
  uo[6]: "SUM[6]"
  uo[7]: "SUM[7]"

  # Bidirectional pins
  uio[0]: "B[0]"
  uio[1]: "B[1]"
  uio[2]: "B[2]"
  uio[3]: "B[3]"
  uio[4]: "B[4]"
  uio[5]: "B[5]"
  uio[6]: "B[6]"
  uio[7]: "B[7]"

# Do not change!
yaml_version: 6
