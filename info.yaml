# Tiny Tapeout project information
project:
  title:        "Programmable Protocol Emulator"
  author:       "JediNakDev" # Replace with your preferred name before submission
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Two programmable pin engines with a bit state machine, checksum and capture units, loaded over a 1 or 4 bit host port"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000 # Initial target, matching CLOCK_PERIOD=20ns in src/config.json

  # Competition allocation: 24 tiles on IHP's 130nm CMOS5L process.
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_jedinakdev_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "pe_host.v"
    - "pe_global.v"
    - "pe_imem.v"
    - "pe_store.v"
    - "pe_pins.v"
    - "pe_g2.v"
    - "pe_engine.v"
    - "pe_fifo.v"
    - "pe_lfsr.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "HCS_N"
  ui[1]: "HSCK"
  ui[2]: "HDI0"
  ui[3]: "HDI1"
  ui[4]: "HDI2"
  ui[5]: "HDI3"
  ui[6]: "P8 (input)"
  ui[7]: "P9 (input)"

  # Outputs
  uo[0]: "HDO0"
  uo[1]: "HDO1"
  uo[2]: "HDO2"
  uo[3]: "HDO3"
  uo[4]: "HIRQ"
  uo[5]: "P10 (output)"
  uo[6]: "P11 (output)"
  uo[7]: "P12 (output)"

  # Bidirectional pins
  uio[0]: "P0"
  uio[1]: "P1"
  uio[2]: "P2"
  uio[3]: "P3"
  uio[4]: "P4"
  uio[5]: "P5"
  uio[6]: "P6"
  uio[7]: "P7"

# Do not change!
yaml_version: 6
